
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>SCANTY SOCIAL BOOST — Admin Setup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7ff;
      color: #172554;
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      background: white;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      box-shadow: 0 12px 40px #1e40af12;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #64748b; line-height: 1.5; }
    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      outline-color: #2563eb;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      margin-top: 17px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      overflow-wrap: anywhere;
    }
    .success { display: block !important; background: #dcfce7; color: #166534; }
    .error { display: block !important; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SCANTY SOCIAL BOOST</h1>
    <p>Secure administrator account setup.</p>

    <form id="setupForm">
      <label for="name">Administrator name</label>
      <input id="name" value="SCANTY ADS" required maxlength="80">

      <label for="email">Administrator email</label>
      <input id="email" type="email" value="g819480@gmail.com" required>

      <label for="password">Create password</label>
      <input id="password" type="password" minlength="14"
        autocomplete="new-password" required
        placeholder="At least 14 characters">

      <label for="setupKey">Admin setup key</label>
      <input id="setupKey" type="password"
        autocomplete="off" required placeholder="Your Cloudflare setup key">

      <button id="submitButton" type="submit">Create Administrator</button>
    </form>

    <div id="message" role="status"></div>
  </main>

  <script>
    const form = document.getElementById("setupForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.className = "";
      message.style.display = "none";
      button.disabled = true;
      button.textContent = "Creating account...";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const setupKey = document.getElementById("setupKey").value;

      try {
        const response = await fetch("/api/admin/setup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-setup-key": setupKey
          },
          body: JSON.stringify({ name, email, password })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || result.message || "Administrator setup failed.");
        }

        message.textContent =
          "Administrator created successfully. Go to the main website and sign in.";
        message.className = "success";
        form.reset();
      } catch (error) {
        message.textContent = error.message || "Could not connect to the server.";
        message.className = "error";
      } finally {
        button.disabled = false;
        button.textContent = "Create Administrator";
      }
    });
  </script>
</body>
</html>
